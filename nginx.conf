# ── DRAPE Fashion OS — Nginx Production Config ──
# Place at: /etc/nginx/sites-available/drape
# Enable:   sudo ln -s /etc/nginx/sites-available/drape /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d yourdomain.com

upstream drape_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL (managed by Certbot) ──
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ── Rate limiting zones ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ── Static frontend with long cache ──
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf)$ {
        proxy_pass http://drape_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── API proxy with rate limiting ──
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://drape_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Strict rate limit for auth endpoints ──
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://drape_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback ──
    location / {
        proxy_pass http://drape_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Logging ──
    access_log /var/log/nginx/drape.access.log combined;
    error_log  /var/log/nginx/drape.error.log warn;

    # ── Max body size for uploads ──
    client_max_body_size 10M;
}
