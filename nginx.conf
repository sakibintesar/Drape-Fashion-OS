# DRAPE Fashion OS — Nginx Reverse Proxy Config
# Copy to /etc/nginx/sites-available/drape
# Symlink to /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=order:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai:10m rate=15r/m;

# Upstream Node.js app (adjust if running multiple workers)
upstream drape_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;  # ← CHANGE THIS

    # Redirect all HTTP to HTTPS (after SSL is provisioned)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;  # ← CHANGE THIS

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;  # ← CHANGE THIS
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;  # ← CHANGE THIS

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss;

    # Client body limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Serve static assets directly (if any) — optional, since app serves its own
    # location /assets/ {
    #     alias /var/www/drape/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }

    # Admin portal — custom path (must match ADMIN_PATH env var)
    location /portal-3ee0946b {  # ← CHANGE THIS to match your ADMIN_PATH
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://drape_backend;
    }

    # Block guessable admin paths
    location = /admin.html {
        return 404;
    }
    location = /admin {
        return 404;
    }

    # API routes with rate limiting
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://drape_backend;
    }

    location /api/auth/register {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://drape_backend;
    }

    location /api/orders {
        limit_req zone=order burst=5 nodelay;
        proxy_pass http://drape_backend;
    }

    location /api/ai/caption {
        limit_req zone=ai burst=5 nodelay;
        proxy_pass http://drape_backend;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://drape_backend;
    }

    # Health check (no rate limit)
    location /api/health {
        proxy_pass http://drape_backend;
        access_log off;
    }

    # Storefront SPA — fallback to index.html
    location / {
        proxy_pass http://drape_backend;
        # SPA fallback handled by Express in server.js
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }
    location ~* \.(sql|sqlite|db|log)$ {
        deny all;
        return 404;
    }
    location /backend/ {
        deny all;
        return 404;
    }
    location /node_modules/ {
        deny all;
        return 404;
    }
    location /package*.json {
        deny all;
        return 404;
    }
}
