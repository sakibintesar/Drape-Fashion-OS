[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node backend/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables — set these in the Railway dashboard:
#   NODE_ENV=production
#   PORT=3000
#   JWT_ACCESS_SECRET=<random 64-char hex>
#   JWT_REFRESH_SECRET=<random 64-char hex>
#   CORS_ORIGIN=https://your-app.up.railway.app
#   SEED_ON_START=true
#
# Add-ons to add via Railway dashboard:
#   1. PostgreSQL — Railway auto-sets DATABASE_URL
#   2. Redis — Railway auto-sets REDIS_URL
